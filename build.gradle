plugins {
 id 'java'
 id 'application'
}

group = 'com.carrental'
version = '1.0-SNAPSHOT'

repositories {
 mavenCentral()
 maven {
 url = 'https://public.dhe.ibm.com/ibmdl/export/pub/software/websphere/maven/repository/'
 }
}

java {
 sourceCompatibility = JavaVersion.VERSION_21
 targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
 implementation 'com.ibm.db2:jcc:11.5.9.0'

 // JUnit 5 Test Dependencies (Jenkins CI/CD Demo)
 testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
 mainClass = 'com.carrental.Main'
}

jar {
 manifest {
 attributes 'Main-Class': 'com.carrental.Main'
 }
 from {
 configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
 }
 duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
 options.encoding = 'UTF-8'
}

// JUnit 5 Test Configuration (Jenkins CI/CD Demo)
test {
 useJUnitPlatform()

 // Headless mode - for CI environment (no GUI)
 jvmArgs = ['-Djava.awt.headless=true']

 // Test output configuration
 testLogging {
 events "passed", "skipped", "failed"
 showExceptions true
 showCauses true
 showStackTraces true
 }
}
